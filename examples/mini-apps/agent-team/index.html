    $("team-icon").append(icon("network"));
    $("close").append(icon("close"));
    $("close").onclick = closeConfig;
    $("config").addEventListener("cancel", (event) => {
      event.preventDefault();
      closeConfig();
    });
    $("config").addEventListener("close", () => {
      if (configTarget) closeConfig();
      (configReturn?.isConnected ? configReturn : $("app")).focus({ preventScroll: true });
    });
    $("rules").onclick = () => {
      const team = currentTeam();
      if (team) void openConfig({ teamId: team.id, name: team.name }, $("rules"));
    };
    $("member-config").onclick = () => {
      const member = currentMember();
      if (member) void openConfig({ teamId: selectedTeam, agentId: member.id, occupantId: member.occupantId ?? null, name: member.name }, $("member-config"));
    };
    for (const tab of ["agent", "skills"]) $(tab + "-tab").onclick = () => {
      if (configuration) configEpoch++;
      configTab = tab;
      showConfig();
    };
    $("tabs").onkeydown = (event) => {
      if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
      event.preventDefault();
      const next = event.key === "Home" ? "agent" : event.key === "End" ? "skills" : configTab === "agent" ? "skills" : "agent";
      $(next + "-tab").click();
      $(next + "-tab").focus();
    };
    $("activity").addEventListener("toggle", () => {
      activityEpoch++;
      if ($("activity").open) void refreshActivity();
    });
    document.addEventListener("visibilitychange", () => {
      clearTimeout(timer);
      if (!document.hidden) void refresh();
    });
    window.addEventListener("pagehide", () => {
      stopped = true;
      clearTimeout(timer);
      closeConfig();
    });
    new MutationObserver(() => {
      render();
      if (configTarget) {
        put($("config-title"), t(configTarget.agentId ? "config" : "rules"));
        put($("agent-tab"), t("agent"));
        put($("skills-tab"), t("skills"));
      }
    }).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
    render();
    if (!window.mausApp?.dashboard?.read) {
      put($("notice"), t("bridge"));
      return;
    }
    void refresh();
  }
  start();
})();
</script>
</body>
</html>
