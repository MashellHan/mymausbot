name: omb-pwa-relay

services:
  pwa-relay:
    image: ${PWA_RELAY_IMAGE:?PWA_RELAY_IMAGE must name the pwa-relay image}
    network_mode: host
    env_file: relay.env
    environment:
      BRIDGE_HOST: 127.0.0.1
      BRIDGE_PORT: "8080"
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    stop_grace_period: 10s
    restart: unless-stopped
    logging:
      driver: journald
      options: { tag: omb-pwa-relay }
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    network_mode: host
    env_file: relay.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    restart: unless-stopped
    depends_on: [pwa-relay]
    logging:
      driver: journald
      options: { tag: omb-pwa-caddy }

volumes:
  caddy_data:
  caddy_config:
