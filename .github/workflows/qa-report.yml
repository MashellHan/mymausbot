name: QA report
run-name: QA report ${{ github.event.workflow_run.id || inputs.run_id || format('hold-{0}', github.event.issue.number) }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  issues:
    types: [closed, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed main CI run to report without rerunning tests
        required: true
        type: string

permissions: {}

jobs:
  scan:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Scan advisory process cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qa/scan.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mausbot-process-scan
          path: process-scan.json
          if-no-files-found: error
          retention-days: 30
  report:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["schedule", "workflow_dispatch", "push"]'), github.event.workflow_run.event) &&
      !(github.event.workflow_run.event == 'push' && github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.display_title == format('Focused main integration {0}', github.event.workflow_run.head_sha)))
    concurrency:
      group: mausbot-qa-report
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Report trusted main results
        env:
          GH_TOKEN: ${{ github.token }}
          QA_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: node scripts/qa/report.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mausbot-qa-report
          path: qa-report.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30
  reconcile:
    if: >-
      (github.event_name == 'issues' &&
      (contains(github.event.issue.labels.*.name, 'qa') || github.event.label.name == 'qa') &&
      (github.event.action == 'closed' || startsWith(github.event.label.name, 'qa:scope:') ||
      contains(fromJSON('["qa","qa:p0","qa:p1","qa:process"]'), github.event.label.name))) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository)
    concurrency:
      group: qa-hold-release-reconcile
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Recheck eligible gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qa/hold-release.mjs
  recover:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 4 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    concurrency:
      group: qa-repair-recovery-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
      checks: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Recover unacquired jobs on a current global-hold repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qa/repair-recovery.mjs
