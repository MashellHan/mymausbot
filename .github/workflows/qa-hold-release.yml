name: Recheck released QA holds

on:
  issues:
    types: [closed, labeled, unlabeled]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  reconcile:
    if: >-
      (github.event_name == 'issues' &&
      (contains(github.event.issue.labels.*.name, 'qa') || github.event.label.name == 'qa') &&
      (github.event.action == 'closed' || startsWith(github.event.label.name, 'qa:scope:') ||
      contains(fromJSON('["qa","qa:p0","qa:p1","qa:process"]'), github.event.label.name))) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository)
    concurrency:
      group: qa-hold-release-reconcile
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Recheck eligible gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qa/hold-release.mjs
